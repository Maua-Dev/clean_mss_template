name: CDK Synth

on:
  workflow_call:

jobs:
  cdkSynth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install -r iac/requirements-infra.txt
          npm install -g aws-cdk

      # STAGE/GITHUB_REF_NAME fixos: iac/app.py normaliza; não precisa de step "Resolve STAGE".
      # No projeto real, renomeie só o prefixo de STACK_NAME (e MSS_NAME se quiser).
      - name: CDK synth
        working-directory: iac
        run: cdk synth
        env:
          AWS_REGION: eu-east-1
          AWS_ACCOUNT_ID: "000000000000"
          STACK_NAME: CleanMssTemplateStackCi
          STAGE: ci
          GITHUB_REF_NAME: ci
          MSS_NAME: clean_mss_template
          GRAPH_MICROSOFT_ENDPOINT: https://graph.microsoft.com/v1.0/me
