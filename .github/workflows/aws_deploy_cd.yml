name: CD

on:
  push:
    branches:
      - dev
      - homolog
      - prod

  workflow_dispatch:

jobs:
  deployGuard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert project is no longer the unmodified template
        run: bash .github/scripts/assert_project_configured.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

  testApp:
    needs: [deployGuard]
    uses: maua-dev/ci_workflows_reusable/.github/workflows/pytest_ci_313.yml@V1.3

  cdkSynth:
    needs: [deployGuard]
    uses: ./.github/workflows/cdk_synth_ci.yml

  DeployToAWS:
    needs: [deployGuard, testApp, cdkSynth]
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set AWS Account ID
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOML }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "prod" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
          else
            echo "Invalid branch name: ${{ github.ref_name }}" && exit 1
          fi

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          role-session-name: github-action

      - name: Setting stage and stack name
        run: |
          echo "STACK_NAME=CleanMssTemplateStack${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Installing Dependencies
        run: |
          npm install -g aws-cdk
          pip install -r requirements-app.txt
          pip install -r iac/requirements-infra.txt

      - name: DeployWithCDK
        working-directory: iac
        run: |
          cdk synth "$STACK_NAME"
          cdk deploy "$STACK_NAME" --require-approval never
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          STACK_NAME: ${{ env.STACK_NAME }}
          STAGE: ${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MSS_NAME: ${{ github.event.repository.name }}
          GRAPH_MICROSOFT_ENDPOINT: ${{ vars.GRAPH_MICROSOFT_ENDPOINT }}
